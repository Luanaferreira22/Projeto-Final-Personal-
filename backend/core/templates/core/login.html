<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Personal Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: #fff; border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden; width: 100%; max-width: 420px;
    }
    .login-header {
      background: linear-gradient(135deg, #e94560, #c73652);
      padding: 35px; text-align: center; color: #fff;
    }
    .login-header h4 { font-weight: 700; margin-bottom: 5px; }
    .login-header p { opacity: 0.85; font-size: 14px; margin: 0; }
    .login-body { padding: 35px; }
    .form-control { border-radius: 10px; padding: 12px 15px; border: 1.5px solid #e0e0e0; }
    .form-control:focus { border-color: #e94560; box-shadow: 0 0 0 3px rgba(233,69,96,0.15); }
    .btn-login {
      background: linear-gradient(135deg, #e94560, #c73652);
      border: none; border-radius: 10px; padding: 12px;
      font-weight: 600; letter-spacing: 0.5px; width: 100%; color: #fff;
      transition: all 0.3s;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(233,69,96,0.4); color: #fff; }
    .input-group-text { border-radius: 10px 0 0 10px; background: #f8f9fa; border: 1.5px solid #e0e0e0; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <i class="bi bi-activity" style="font-size:2.5rem;"></i>
      <h4 class="mt-2">Personal Manager</h4>
      <p>Gestão de Treinos para Personal Trainers</p>
    </div>
    <div class="login-body">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger rounded-3 py-2 small">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold small">Usuário</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person text-muted"></i></span>
            <input type="text" name="username" class="form-control" placeholder="Digite seu usuário" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small">Senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" name="password" class="form-control" placeholder="Digite sua senha" required>
          </div>
        </div>
        <button type="submit" class="btn btn-login">
          <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </button>
      </form>
      <p class="text-center text-muted small mt-4 mb-0">
        <i class="bi bi-shield-lock me-1"></i>Acesso restrito ao personal trainer
      </p>
    </div>
  </div>
</body>
</html>
