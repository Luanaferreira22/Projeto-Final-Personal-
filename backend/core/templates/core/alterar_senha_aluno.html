<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alterar Senha — Personal Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f2f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { border-radius: 16px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,.08); max-width: 460px; width: 100%; }
    .form-control { border-radius: 10px; padding: 11px 15px; border: 1.5px solid #e0e0e0; }
    .form-control:focus { border-color: #1abc9c; box-shadow: 0 0 0 3px rgba(26,188,156,.12); }
    .btn-salvar { background: linear-gradient(135deg, #1abc9c, #0e9c80); border: none; border-radius: 10px; color: #fff; font-weight: 600; padding: 11px; width: 100%; }
    .btn-salvar:hover { opacity: .9; color: #fff; }
    .input-group-text { background: #f8f9fa; border: 1.5px solid #e0e0e0; }
  </style>
</head>
<body>
<div class="container px-3">
  <div class="card mx-auto">
    <div class="card-header bg-white py-3 border-0">
      <h6 class="mb-0 fw-bold">
        <i class="bi bi-shield-lock me-2 text-success"></i>Alterar Senha
      </h6>
    </div>
    <div class="card-body px-4 pb-4">

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }} py-2 small rounded-3">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-semibold small">Senha atual</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" name="senha_atual" class="form-control"
                   placeholder="Digite sua senha atual" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold small">Nova senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill text-muted"></i></span>
            <input type="password" name="nova_senha" class="form-control"
                   placeholder="Digite a nova senha" required minlength="6">
          </div>
          <small class="text-muted">Minimo 6 caracteres</small>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold small">Confirmar nova senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill text-muted"></i></span>
            <input type="password" name="confirmar_senha" class="form-control"
                   placeholder="Confirme a nova senha" required minlength="6">
          </div>
        </div>

        <button type="submit" class="btn btn-salvar mb-3">
          <i class="bi bi-check-lg me-2"></i>Salvar Nova Senha
        </button>

        <div class="text-center">
          <a href="{% url 'painel_aluno' %}" class="small text-muted text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i>Voltar para o painel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
