{% extends 'core/base.html' %}
{% block title %}Novo Exercício{% endblock %}
{% block page_title %}Novo Exercício{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header bg-white py-3">
        <h6 class="mb-0 fw-bold"><i class="bi bi-dumbbell me-2 text-danger"></i>Cadastrar Exercício</h6>
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">Nome *</label>
            {{ form.nome }}
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Grupo Muscular *</label>
            {{ form.grupo_muscular }}
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold small">Descrição</label>
            {{ form.descricao }}
          </div>
          <div class="d-flex justify-content-between">
            <a href="{% url 'lista_exercicios' %}" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left me-1"></i>Cancelar
            </a>
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-check-lg me-1"></i>Salvar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
